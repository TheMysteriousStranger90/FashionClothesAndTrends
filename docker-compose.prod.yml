version: "3.9"

services:
  webapi:
    build:
      context: .
      dockerfile: ./src/FashionClothesAndTrends.WebAPI/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${WEB_HTTP_PORT:-8080}:80"
      - "${WEB_HTTPS_PORT:-8443}:443"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: https://+;http://+
      ASPNETCORE_HTTPS_PORT: ${WEB_HTTPS_PORT:-8443}
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/localhost.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${KESTREL_CERT_PASSWORD}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/health/ready" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./logs:/logs
      - ./localhost.pfx:/https/localhost.pfx:ro
      - data_protection_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      sql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  client:
    build:
      context: ./src/ClientApp
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${CLIENT_HTTP_PORT:-80}:80"
    depends_on:
      webapi:
        condition: service_healthy
    networks:
      - app_network
  redis:
    image: redis:latest
    restart: unless-stopped
    env_file:
      - .env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --protected-mode no
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    container_name: sql_server2022
    env_file:
      - .env
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    volumes:
      - sqldata:/var/opt/mssql
    expose:
      - "1433"
    healthcheck:
      test: CMD /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P ${SA_PASSWORD} -Q "SELECT 1" || exit 1
      timeout: 20s
      retries: 10
      start_period: 20s
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:v2.45.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - app_network

  grafana:
    image: grafana/grafana:10.0.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  sqldata:
  redis_data:
  prometheus_data:
  grafana_data:
  data_protection_keys:
