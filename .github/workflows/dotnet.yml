# This workflow is superseded by the split workflows:
#   ci.yml          - Build & test with code coverage
#   codeql.yml      - CodeQL security scanning (weekly + on push/PR)
#   docker-build.yml- Docker image dry-run build
#   deploy.yml      - Production deploy (triggered after CI on master)
#
# Kept as a lightweight sanity check on PRs to non-develop/master branches.

name: .NET Quick Check

on:
  push:
    branches-ignore: [ develop, master ]
  pull_request:
    branches-ignore: [ develop, master ]

jobs:
  quick-build:
    name: Quick Build (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore FashionClothesAndTrends.sln

      - name: Build
        run: dotnet build FashionClothesAndTrends.sln -c Release --no-restore

      - name: Test
        run: dotnet test FashionClothesAndTrends.sln -c Release --no-build --verbosity normal
