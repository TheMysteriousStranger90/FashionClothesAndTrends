name: Deploy with Docker Compose

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [ master ]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment variables
        run: |
          echo "JWT_KEY=${{ secrets.JWT_KEY }}" >> .env.production
          echo "JWT_ISSUER=${{ secrets.JWT_ISSUER }}" >> .env.production
          echo "JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}" >> .env.production
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env.production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml push

      - name: Health Check
        run: |
          timeout 300 bash -c 'until curl -sf http://localhost:8080/health; do sleep 5; done'
          echo "Application is healthy!"

      - name: Notify on completion
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Deploy completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Deploy FAILED" >> $GITHUB_STEP_SUMMARY
          fi
